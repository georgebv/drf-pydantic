name: Test

on:
  workflow_call:
  pull_request:
    branches:
      - "main"

jobs:
  test-linux:
    name: Linux, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --all-groups
      - name: Run tests and generate coverage report
        run: uv run pytest
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        if: success() && matrix.python-version == '3.13'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true
  test-windows:
    name: Windows, Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --all-groups
      - name: Run tests
        run: uv run pytest
  tests-passed:
    # Single, stable check name to require in branch rulesets (matrix job names are dynamic).
    # `always()` ensures this job reports failure, rather than "skipped", when a matrix job fails.
    name: All tests passed
    if: always()
    needs: [test-linux, test-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "test-linux: ${{ needs.test-linux.result }}"
          echo "test-windows: ${{ needs.test-windows.result }}"
          exit 1
